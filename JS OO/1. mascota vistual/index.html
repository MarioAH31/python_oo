<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <title>Mascota Virtual</title>
 <style>
 body { font-family: sans-serif; max-width: 480px;
 margin: 40px auto; padding: 20px; background: #F0F4FF; }
 .tarjeta { background: white; border-radius: 16px;
 padding: 24px; box-shadow: 0 4px 16px rgba(0,0,0,.1); }
 .emoji-grande { font-size: 80px; text-align: center; }
 h2 { text-align: center; color: #16213E; }
 .barra-cont { background: #E8EAF6; border-radius: 999px; height: 14px; margin: 6px
0 16px; }
 .barra { height: 14px; border-radius: 999px;
 transition: width .4s ease; }
 .stat-label { display: flex; justify-content: space-between; font-size: 14px;
color: #555; }
 .botones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
 button { flex: 1; padding: 10px; border: none; border-radius: 10px;
 font-size: 15px; cursor: pointer; font-weight: bold; }
 #btn-comer { background: #A8E6CF; color: #1B4332; }
 #btn-jugar { background: #FFD3B6; color: #7D4700; }
 #btn-dormir { background: #D6BCFA; color: #4A148C; }
 #log { margin-top: 14px; font-size: 14px; color: #555;
 min-height: 24px; text-align: center; font-style: italic; }
 </style>
</head>
<body>
 <div class="tarjeta">
 <div class="emoji-grande" id="emoji-mascota">🐶</div>
 <h2 id="nombre-mascota">Cargando...</h2>
 <div class="stat-label"><span>🍖 Hambre</span><span id="val-hambre">0</span></div>
 <div class="barra-cont">
 <div class="barra" id="barra-hambre" style="background:#F87171;width:50%"></div>
 </div>
 <div class="stat-label"><span>⚡ Energía</span><span id="val-energia">0</span></div> <div class="barra-cont">
 <div class="barra" id="barra-energia" style="background:#34D399;width:80%"></div>
 </div>
 <div class="stat-label"><span>😊 Felicidad</span><span id="val-felicidad">0</span></div>
 <div class="barra-cont">
 <div class="barra" id="barra-felicidad"
style="background:#60A5FA;width:70%"></div>
 </div>
 <div class="stat-label"><span>🎂 Edad</span><span id="val-edad">0</span></div>
 <div class="barra-cont">
 <div class="barra" id="barra-edad" style="background:#8B5CF6;width:0%"></div>
 </div>
 <div class="stat-label"><span>Nivel</span><span id="val-nivel"></span></div>
 <div class="barra-cont">
 <div class="barra" id="barra-nivel" style="background: #16213E;width:50%"></div>
 </div>
 </div>
 <div class="botones">
 <button id="btn-comer" onclick="miMascota.comer()">🍖 Comer</button>
 <button id="btn-jugar" onclick="miMascota.jugar()">🎾 Jugar</button>
 <button id="btn-dormir" onclick="miMascota.dormir()">😴 Dormir</button>
 <button id="btn-cumpleanos" onclick="miMascota.cumpleanos()">🥳 Cumpleaños</button>
 </div>
 <div id="log"></div>
 </div>
 <script>
 // === TODA LA LÓGICA JS VA AQUÍ ===
 // Una clase es un plano/molde. Todavía no es un objeto.
// ══════════════════════════════════════════════════
class Mascota {
 // constructor() se ejecuta automáticamente cuando escribes: new Mascota(...)
 // "this" se refiere a ESTA instancia concreta de la clase
 constructor(nombre, emoji) {
 this.nombre = nombre; // propiedad: nombre de la mascota
 this.emoji = emoji; // propiedad: su representación visual
 this.hambre = 50; // 0 = lleno, 100 = muy hambriento
 this.energia = 80; // 0 = agotado, 100 = lleno de energía
 this.felicidad = 70; // 0 = triste, 100 = feliz
 this.edad = 0; 
 this.nivel = 1;
 }
 // MÉTODO: comer()
 // Un método es una función que pertenece a la clase
 comer() {
 this.hambre = Math.max(0, this.hambre - 30);
 this.energia = Math.min(100, this.energia + 10);
 this.felicidad = Math.min(100, this.felicidad + 5);
 this.verificarNivel("¡Qué rico! 😋 Hambre reducida.");
 }
 jugar() {
 if (this.energia < 20) {this.actualizarUI("Estoy muy cansado para jugar... 😴");
 return;
 }
 this.energia = Math.max(0, this.energia - 25);
 this.hambre = Math.min(100, this.hambre + 15);
 this.felicidad = Math.min(100, this.felicidad + 20);
 this.verificarNivel("¡Woof! Qué divertido 🎾");
 }
 dormir() {
 this.energia = Math.min(100, this.energia + 40);
 this.felicidad = Math.min(100, this.felicidad + 10);
 this.verificarNivel("Zzzz... 😴 Energía recuperada.");
 }
 cumpleanos() {
   this.edad = Math.max(0, this.edad + 1);
   this.actualizarUI("¡Feliz cumpleaños! 🎉");
 }
 verificarNivel(mensaje) {
   if (this.felicidad >= 100) {
     this.nivel++;
     this.felicidad = 50; // Bajamos un poco la felicidad para seguir jugando
     this.actualizarUI("¡Felicidades! 🌟 Subiste al Nivel " + this.nivel);
   } else {
     this.actualizarUI(mensaje);
   }
 }
 // Este método actualiza el DOM con los valores actuales
 actualizarUI(mensaje) {
 document.getElementById("nombre-mascota").innerHTML = this.nombre;

 let emojiStatus = this.emoji;
 if (this.hambre > 80) emojiStatus = "😢";
 else if (this.felicidad > 80) emojiStatus = "😄";

 document.getElementById("emoji-mascota").innerHTML = emojiStatus;
 document.getElementById("val-hambre").innerHTML = this.hambre;
 document.getElementById("val-energia").innerHTML = this.energia;
 document.getElementById("val-felicidad").innerHTML = this.felicidad;
 document.getElementById("val-edad").innerHTML = this.edad;
 document.getElementById("val-nivel").innerHTML = this.nivel;
 // Las barras se ajustan con el porcentaje como ancho CSS
 document.getElementById("barra-hambre").style.width = this.hambre + "%";
 document.getElementById("barra-energia").style.width = this.energia + "%";
 document.getElementById("barra-felicidad").style.width = this.felicidad + "%";
 // Multiplicamos por 10 para que se note el avance (ej: Nivel 1 = 10%)
 document.getElementById("barra-edad").style.width = Math.min(100, this.edad * 10) + "%";
 document.getElementById("barra-nivel").style.width = (this.nivel * 10) + "%";

 document.getElementById("log").innerHTML = mensaje;
 }
}
// ══════════════════════════════════════════════════
// CREAR UNA INSTANCIA (un objeto concreto del molde)
// new Mascota() llama al constructor automáticamente
// ══════════════════════════════════════════════════
const miMascota = new Mascota("Uche", "🐶");
// Mostramos el estado inicial en pantalla
miMascota.actualizarUI("¡Hola! Soy "+miMascota.nombre+" 👋");
 </script>
</body>
</html>
