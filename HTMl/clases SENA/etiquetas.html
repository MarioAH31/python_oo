<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejemplo de etiquetas HTML5</title>
</head>
<body>

  <header>
    <hgroup>
      <h1>Mi Blog Personal</h1>
      <h2>Compartiendo ideas y noticias</h2>
    </hgroup>
    <nav>
      <a href="#inicio">Inicio</a> |
      <a href="#articulos">Artículos</a>
    </nav>
  </header>

  <section id="articulos">
    <article>
      <h2>Nuevo Descubrimiento</h2>
      <p>Publicado el <time datetime="2025-11-10">10 de noviembre de 2025</time></p>
      <p>El hallazgo fue <mark>impactante</mark> para la comunidad científica.</p>
    </article>
  </section>

  <aside>
    <p><span style="color:blue;">Publicidad:</span> Visita nuestro canal de noticias.</p>
  </aside>

  <footer>
    <p>© 2025 Mi Blog Personal</p>
  </footer>

</body>
</html>
