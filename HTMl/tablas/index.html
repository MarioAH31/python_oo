<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <table>
        <thead>
            <tr>
                <th class="bold">Producto</th>
                <th class="bold">Precio</th>
                <th class="bold">Cantidad</th>
            </tr>
        </thead>
        <tbody>
        <tr>
            <td>Manzana</td>
            <td>$5.000</td>
            <td>1KG</td>
        </tr>
        <tr>
            <td>Banano</td>
            <td>$2.000</td>
            <td>1KG</td>
        </tr>
        <tr>
            <td>Pera</td>
            <td>$10.000</td>
            <td>1KG</td>
        </tr>  
        </tbody>
        <tfoot> 
        <tr>
            <th class="header_total">Total</th>
            <td class="dato_total" colspan="2">$17.000</td>
        </tr>  
        </tfoot>
    </table>
</body>
</html>
