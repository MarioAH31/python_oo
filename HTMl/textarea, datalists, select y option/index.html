<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Textarea</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <form action="">
        <h2>Formulario de contacto</h2>

        <!-- Simple inputs -->
        <div class="form_input">
            <label for="Nombre">Nombre
            <input type="text" placeholder="Mario Alejandro" id="Nombre">
            </label>
        </div>
        <div class="form_input">
            <label for="Correo">Correo electrónico
            <input type="email" placeholder="mario@gmail.com" id="Correo">
            </label>
        </div>

        <!-- Select y Option -->
        <div class="form_input">
            <label>Tipo de usuario
            <select name="type-of-user">
                <option value="user1">Seguidor/a</option>
                <option value="user2">Empresa</option>
                <option value="user3">Otros</option>
            </select>
            </label>
        </div>

         <!-- Datalist y Option -->
        <div class="form_input">
            <label>Tipo de usuario
            <select name="type-of-user">
                <option value="user1">Seguidor/a</option>
                <option value="user2">Empresa</option>
                <option value="user3">Otros</option>
            </select>
            </label>
        </div>

        <!-- Textarea -->
        <div class="form_input">
            <label for="Comentario">Comentario       
            <textarea rows="7" id="Comentario">Ingresa un comentario...</textarea>
            </label>
        </div>
        <div class="form_input">
            <label>Acepto términos y condiciones     
                <input type="checkbox" class="checkbox">
            </label>
        </div>
    </form>
</body>
</html>
